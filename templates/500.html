{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor | Parque Safari POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #151f35 0%, #080c16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f1f5f9;
        }
        .error-card {
            max-width: 540px;
            background: rgba(17, 24, 39, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="display-3 fw-black text-danger mb-2">500</div>
        <h1 class="h4 fw-bold text-white mb-3">Error interno del servidor — Parque Safari POS</h1>
        <p class="text-secondary mb-4">
            Ocurrió un inconveniente temporal al procesar la solicitud. Ningún dato sensible ni traza interna ha sido expuesto.
        </p>
        <a href="/" class="btn btn-warning fw-bold px-4 py-2">
            <i class="bi bi-arrow-left-circle-fill me-1"></i> Volver al Sistema POS
        </a>
    </div>
</body>
</html>
