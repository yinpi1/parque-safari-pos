{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor | Parque Safari POS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #2a151b 0%, #0c0809 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #f1f5f9;
        }
        .error-wrapper {
            width: 100%;
            max-width: 560px;
        }
        .error-card {
            background: rgba(24, 17, 19, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 24px;
            padding: 2.75rem 2rem;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(239, 68, 68, 0.1);
        }
        .error-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #fff;
            margin: 0 auto 1.25rem;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.75rem;
        }
        .error-text {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }
        .btn-safari {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: #0b0f19;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .btn-safari:hover {
            color: #0b0f19;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <div class="error-card">
            <div class="error-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
            <div class="error-code">500</div>
            <h1 class="error-title">Error Interno del Servidor</h1>
            <p class="error-text">
                Ocurrió un problema inesperado al procesar la solicitud. Nuestro equipo técnico ha sido notificado para resolverlo a la brevedad.
            </p>
            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                <a href="{% url 'dashboard' %}" class="btn btn-safari">
                    <i class="bi bi-house-door-fill me-1"></i> Ir al Panel Principal
                </a>
            </div>
        </div>
    </div>
</body>
</html>
